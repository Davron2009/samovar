services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: samovar
      POSTGRES_USER: samovar
      POSTGRES_PASSWORD: samovar_local
    ports:
      - "5432:5432"
    volumes:
      - samovar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samovar -d samovar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  samovar-postgres:
